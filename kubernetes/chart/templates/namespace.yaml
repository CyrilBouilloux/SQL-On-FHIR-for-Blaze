{{- if .Values.namespace.create }}
{{/* PSA `restricted` dès la première ligne : `enforce` applique, `audit` et
     `warn` ne font que dire. */}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    {{- include "blaze.etiquettes" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v{{ .Values.versions.k8sMinor }}
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
