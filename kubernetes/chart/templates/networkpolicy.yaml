{{- if .Values.reseau.politiques }}
{{/* Refus par défaut en entrée, puis une ouverture par maillon :
       client ──8090──▶ nginx ──8080──▶ blaze
     Seule l'ENTRÉE est bornée. Une politique ne vaut que si le CNI
     l'applique : le smoke le MESURE (maillon 8). */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refus-par-defaut
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entree-nginx
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: nginx }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ protocol: TCP, port: 8090 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entree-blaze
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: blaze }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: nginx }
      ports: [{ protocol: TCP, port: 8080 }]
{{- end }}
