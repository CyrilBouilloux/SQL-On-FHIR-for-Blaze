# Reverse proxy de politique devant Blaze (CLAUDE.md §4, garde-fou 2).
#
# `_include` et `_revinclude` sont plafonnés ICI, pas dans Blaze : au-delà du
# plafond la requête est rejetée en 400, jamais tronquée en silence. Le plafond
# déclaré est `proxy.plafondInclude` de kubernetes/chart/values.yaml ;
# scripts/check_gardefou7.py échoue si les deux divergent.
#
# Dév / banc : pas de TLS, pas d'authentification (ADR 0001, points ouverts).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    client_max_body_size 256m;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;

    upstream blaze {
        server blaze:8080;
        keepalive 16;
    }

    # PLAFOND_INCLUDE = 5 : 6 occurrences ou plus de _include/_revinclude -> 1.
    map $args $include_depasse {
        default 0;
        "~(_include|_revinclude)(.*(_include|_revinclude)){5,}" 1;
    }

    server {
        listen 8090;
        server_name _;

        location /fhir {
            if ($args ~* "_include:iterate|_revinclude:iterate") {
                return 400 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"too-costly","diagnostics":"_include:iterate est interdit (garde-fou 2)."}]}';
            }
            if ($include_depasse) {
                return 400 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"too-costly","diagnostics":"Plus de 5 _include/_revinclude (garde-fou 2)."}]}';
            }
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://blaze;
        }

        # Sonde : traverse nginx ET Blaze.
        location = /healthz {
            access_log off;
            proxy_pass http://blaze/health;
        }
    }
}
