# demo/synthea.properties — configuration de Synthea du jeu de démonstration (F-037, T-106).
# Versionnée ; lue par demo/generer-jeu.sh (-c). Population, graines et date de
# référence sont des paramètres de la commande (demo/generer-jeu.sh), consignés dans
# demo/donnees/provenance.txt.

# Sortie : un Bundle par ligne (non indenté), jamais compressé.
exporter.fhir.export = true
# Sans effet sur les bundles de patient (mesuré) : demo/generer-jeu.sh les met en une ligne.
exporter.pretty_print = false
exporter.fhir.bulk_data = false

# Historique réduit : poids du jeu (cible 20 000 000 octets, F-037).
exporter.years_of_history = 1

# Ressources non exportées : poids, et aucune utilité pour la démonstration.
exporter.fhir.excluded_resources = ExplanationOfBenefit,Claim,Provenance

# Exactement n patients : on ne génère que des vivants (décidé, non mesuré —
# ADR 0013, point ouvert 5 ; à false, 114 Patient pour une population de 100).
generate.only_alive_patients = true
